name: Weekly Chart Collector

on:
  schedule:
    # Mondays at 14:00 UTC (Primary run) & Wednesdays at 14:00 UTC (Automatic catch-up fallback)
    - cron: '0 14 * * 1,3'
  workflow_dispatch: # Allows one-click manual run from GitHub Actions tab

permissions:
  contents: write

jobs:
  collect:
    name: Collect & Commit Chart Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Chart Dataset Collector
        run: npm run scrape:charts
        env:
          CHART_SOURCE: ${{ vars.CHART_SOURCE }}
          CHART_REGION: ${{ vars.CHART_REGION }}
          MAX_ROWS: ${{ vars.MAX_ROWS }}

      - name: Commit and push updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/chart_dataset.csv data/raw/
          git diff --cached --quiet || git commit -m "chore: weekly chart snapshot $(date -u +'%Y-%m-%d')"
          git push

